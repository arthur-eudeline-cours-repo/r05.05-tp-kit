name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tp-kit/**"
      - "storybook/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Node 24 = LTS active ("Krypton"). Pas de `cache: pnpm` ici : ce dépôt
      # ne versionne pas de pnpm-lock.yaml
      # (il est reconstruit par scripts/split-ui-kit-public.sh depuis le
      # monorepo, dont le lockfile décrit une autre workspace), et setup-node
      # échoue s'il ne trouve pas de lockfile sur lequel baser sa clé de cache.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # tp-kit's shadcn registry (public/r) is rebuilt automatically by
      # storybook's own "prebuild" script.
      - name: Build Storybook
        run: pnpm --dir storybook run build

      # Prérequis (une seule fois, côté dépôt public) : Settings > Pages >
      # Source = "GitHub Actions". Ne pas utiliser `enablement: true` ici : le
      # GITHUB_TOKEN n'a pas le droit de créer le site Pages ("Resource not
      # accessible by integration"), même avec `pages: write`.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Storybook build
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook/.build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
