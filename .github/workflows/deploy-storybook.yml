name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tp-kit/**"
      - "storybook/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Pas de `cache: pnpm` ici : ce dépôt ne versionne pas de pnpm-lock.yaml
      # (il est reconstruit par scripts/split-ui-kit-public.sh depuis le
      # monorepo, dont le lockfile décrit une autre workspace), et setup-node
      # échoue s'il ne trouve pas de lockfile sur lequel baser sa clé de cache.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # tp-kit's shadcn registry (public/r) is rebuilt automatically by
      # storybook's own "prebuild" script.
      - name: Build Storybook
        run: pnpm --dir storybook run build

      # `enablement: true` active GitHub Pages (source = GitHub Actions) si ce
      # n'est pas déjà fait, pour que le dépôt public soit fonctionnel sans
      # aller cocher quoi que ce soit dans ses Settings après un re-split.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Storybook build
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook/.build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
